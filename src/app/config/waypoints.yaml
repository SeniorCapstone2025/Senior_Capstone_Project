# Waypoints for inventory scanning navigation
# 4x6 ft quadrilateral track (one side 3.5ft)
# Coordinates recorded from AMCL pose on the real robot
# theta is orientation in radians (yaw)

waypoints:
  home:
    x: 0.0
    y: 0.0
    theta: 0.0

  shelf_1:
    x: -1.0290
    y: -0.1003
    theta: -3.0295  # ~174 deg - facing back toward home

  shelf_2:
    x: -0.9975
    y: -1.9223
    theta: -2.8169  # ~161 deg - facing back toward home

  shelf_3:
    x: -0.3119
    y: -1.7865
    theta: 0.0993   # ~6 deg - facing forward

# Default scan route (order of shelves to visit)
scan_route:
  - shelf_1
  - shelf_2
  - shelf_3
